# Fly.io deployment for the API. See DEPLOY.md for the full recipe.
# After: fly launch --copy-config --no-deploy --name pm-api

app = "pm-api"
primary_region = "iad"   # change to your nearest Fly region

[build]

[env]
  NODE_ENV = "production"
  PORT = "4000"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"   # idle apps cost nothing
  auto_start_machines = true
  min_machines_running = 0

  [http_service.checks]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "2s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[deploy]
  # Migrations run as part of the container CMD, but if you ever need a one-off:
  # release_command = "npm run migrate:up"
